[package]
name = "ytgrab"
version = "1.2.0"
description = "YouTube Downloader"
authors = ["MicaelSanPedro"]
edition = "2021"

[lib]
name = "ytgrab_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# `stream` é usado pelo setup do Linux (linux_setup.rs) para baixar o
# .tar.xz do ffmpeg em streaming, sem carregar os ~40 MB na memória.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
regex-lite = "0.1"
# Android auto-setup: gunzip the Termux index and extract the .deb packages
flate2 = "1"
xz2 = "0.1"
tar = { version = "0.4", default-features = false }
# Linux auto-setup: stream the static ffmpeg .tar.xz (already in the tree
# through reqwest/tokio, declared explicitly because we use it directly)
futures-util = "0.3"
