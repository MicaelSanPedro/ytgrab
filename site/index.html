<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTGrab — Baixe vídeos e músicas do YouTube</title>
  <meta name="description" content="Baixe vídeos e músicas do YouTube em alta qualidade, direto do navegador. Grátis e de código aberto." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand">
          <span class="logo">🎬</span>
          <h1>YT<span class="grad">Grab</span></h1>
        </div>
        <div class="header-actions">
          <button id="btnLang" class="icon-btn" title="Idioma / Language">🌐</button>
          <button id="btnTheme" class="icon-btn" title="Tema">🌙</button>
          <button id="btnSettings" class="icon-btn" title="Configurações">⚙️</button>
        </div>
      </div>
      <p class="tagline" id="tagline">Baixe vídeos e músicas do YouTube</p>
      <button id="connChip" class="chip" title="Servidor">
        <span class="dot"></span><span id="connText">conectando…</span>
      </button>
    </header>

    <!-- Busca -->
    <div class="card search-card">
      <div class="search-row">
        <input id="urlInput" type="url" placeholder="Cole o link do YouTube aqui..." autocomplete="off" />
        <button id="btnFetch" class="btn primary">🔍 <span data-i18n="getInfo">Buscar</span></button>
      </div>
      <p id="statusMsg" class="status"></p>
    </div>

    <!-- Resultado -->
    <div id="result" class="card hidden">
      <div class="video-info">
        <img id="thumb" alt="" />
        <div class="video-meta">
          <h2 id="videoTitle"></h2>
          <p id="videoDuration" class="sub"></p>
        </div>
      </div>

      <div class="tabs">
        <button id="tabVideo" class="tab active">🎬 <span data-i18n="tabVideo">Vídeo</span></button>
        <button id="tabAudio" class="tab">🎵 <span data-i18n="tabAudio">Áudio</span></button>
      </div>

      <div class="controls">
        <div id="videoControls" class="ctrl-row">
          <label data-i18n="quality">Qualidade:</label>
          <select id="videoQuality"></select>
        </div>
        <div id="audioControls" class="ctrl-row hidden">
          <label data-i18n="audioFormat">Formato:</label>
          <select id="audioFormat"></select>
        </div>
      </div>

      <button id="btnDownload" class="btn primary big">⬇ <span data-i18n="download">Baixar</span></button>

      <div id="progressWrap" class="hidden">
        <div class="progress-bar"><div id="progressFill"></div></div>
        <p id="progressText" class="sub"></p>
      </div>
    </div>

    <footer>
      <div class="app-links">
        <a class="app-link" href="https://github.com/MicaelSanPedro/ytgrab/releases" target="_blank" rel="noopener">📥 YTGrab <span>(Windows e Linux)</span></a>
        <a class="app-link" href="https://github.com/MicaelSanPedro/TuneGrab" target="_blank" rel="noopener">📱 TuneGrab <span>(Android)</span></a>
      </div>
      <p class="credits sub">
        <span data-i18n="madeBy">Feito por</span>
        <a class="credit-link" href="https://github.com/MicaelSanPedro" target="_blank" rel="noopener">Micael San</a>
        &amp;
        <a class="credit-link" href="https://github.com/lucasgabrieldevgg" target="_blank" rel="noopener">lucasgabrieldevgg</a>
      </p>
    </footer>
  </div>

  <!-- Modal de configurações (só o essencial) -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal card">
      <h2>⚙️ <span data-i18n="settings">Configurações</span></h2>

      <label data-i18n="language">Idioma</label>
      <select id="langSelect">
        <option value="pt">Português (Brasil)</option>
        <option value="en">English</option>
      </select>

      <label data-i18n="theme">Tema</label>
      <select id="themeSelect">
        <option value="dark" data-i18n="themeDark">Escuro</option>
        <option value="light" data-i18n="themeLight">Claro</option>
      </select>

      <div class="server-box">
        <p class="sub" id="serverInfo"></p>
        <button id="btnReconnect" class="btn small">🔌 <span data-i18n="reconnect">Reconectar</span></button>
      </div>

      <div class="modal-actions">
        <button id="btnCloseSettings" class="btn primary" data-i18n="close">Fechar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
