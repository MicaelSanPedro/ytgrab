<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTGrab — Baixe vídeos e músicas do YouTube</title>
  <meta name="description" content="Baixe vídeos e músicas do YouTube em alta qualidade, direto do navegador." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>🎬 YTGrab</h1>
        <div class="header-actions">
          <button id="btnLang" class="icon-btn" title="Idioma / Language">🌐</button>
          <button id="btnTheme" class="icon-btn" title="Tema">🌙</button>
          <button id="btnSettings" class="icon-btn" title="Configurações">⚙️</button>
        </div>
      </div>
      <p class="tagline" id="tagline">Baixe vídeos e músicas do YouTube</p>
    </header>

    <!-- Aviso: backend necessário -->
    <div id="needBackend" class="card warn hidden">
      <h3 id="needBackendTitle">⚠️ Configure um servidor primeiro</h3>
      <p id="needBackendText"></p>
      <button id="btnOpenSettingsFromWarn" class="btn primary" data-i18n-open-settings>⚙️ Abrir configurações</button>
    </div>

    <!-- Busca -->
    <div class="card">
      <div class="search-row">
        <input id="urlInput" type="url" placeholder="Cole o link do YouTube aqui..." autocomplete="off" />
        <button id="btnFetch" class="btn primary">🔍 <span data-i18n="getInfo">Buscar</span></button>
      </div>
      <p id="statusMsg" class="status"></p>
    </div>

    <!-- Resultado -->
    <div id="result" class="card hidden">
      <div class="video-info">
        <img id="thumb" alt="" />
        <div class="video-meta">
          <h2 id="videoTitle"></h2>
          <p id="videoDuration" class="sub"></p>
        </div>
      </div>

      <div class="tabs">
        <button id="tabVideo" class="tab active">🎬 <span data-i18n="tabVideo">Vídeo (MP4)</span></button>
        <button id="tabAudio" class="tab">🎵 <span data-i18n="tabAudio">Áudio</span></button>
      </div>

      <div class="controls">
        <div id="videoControls">
          <label data-i18n="quality">Qualidade:</label>
          <select id="videoQuality"></select>
        </div>
        <div id="audioControls" class="hidden">
          <label data-i18n="audioFormat">Formato:</label>
          <select id="audioFormat">
            <option value="mp3">MP3</option>
            <option value="opus">OPUS</option>
            <option value="ogg">OGG</option>
            <option value="wav">WAV</option>
          </select>
          <label data-i18n="audioBitrate">Bitrate:</label>
          <select id="audioBitrate">
            <option value="320">320 kbps</option>
            <option value="256">256 kbps</option>
            <option value="128" selected>128 kbps</option>
            <option value="96">96 kbps</option>
          </select>
        </div>
      </div>

      <button id="btnDownload" class="btn primary big">⬇ <span data-i18n="download">Baixar</span></button>

      <div id="progressWrap" class="hidden">
        <div class="progress-bar"><div id="progressFill"></div></div>
        <p id="progressText" class="sub"></p>
      </div>
    </div>

    <footer>
      <p class="sub">
        <span data-i18n="getTheApp">Prefere o app?</span>
        <a href="https://github.com/MicaelSanPedro/ytgrab/releases" target="_blank" rel="noopener">📥 <span data-i18n="downloadApp">Baixe o YTGrab</span></a>
        ·
        <a href="https://github.com/MicaelSanPedro/TuneGrab" target="_blank" rel="noopener">📱 <span data-i18n="androidApp">App Android (TuneGrab)</span></a>
      </p>
      <p class="credits sub">
        <span data-i18n="madeBy">Feito por</span>
        <a class="credit-link" href="https://github.com/lucasgabrieldevgg" target="_blank" rel="noopener">lucasgabrieldevgg</a>
        &amp;
        <a class="credit-link" href="https://github.com/MicaelSanPedro" target="_blank" rel="noopener">Micael San</a>
      </p>
    </footer>
  </div>

  <!-- Modal de configurações -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal card">
      <h2>⚙️ <span data-i18n="settings">Configurações</span></h2>

      <label data-i18n="backendType">Servidor (backend)</label>
      <select id="backendType">
        <option value="cobalt">Cobalt (recomendado)</option>
        <option value="invidious">Invidious (instância pública)</option>
      </select>

      <label data-i18n="backendUrl">Endereço do servidor</label>
      <div class="search-row">
        <input id="backendUrl" type="url" placeholder="https://seu-servidor.onrender.com" />
        <button id="btnTestBackend" class="btn">🔌 <span data-i18n="test">Testar</span></button>
      </div>
      <p id="backendTestResult" class="status"></p>

      <div id="quickInstances">
        <label data-i18n="tryPublic">Ou tente uma instância pública (instável):</label>
        <div id="instanceList" class="instance-list"></div>
      </div>

      <details class="help-box">
        <summary data-i18n="howToSetup">📖 Como criar o seu servidor Cobalt de graça (5 min)</summary>
        <div id="setupGuide" class="guide"></div>
      </details>

      <div class="modal-actions">
        <button id="btnSaveSettings" class="btn primary" data-i18n="save">Salvar</button>
        <button id="btnCloseSettings" class="btn" data-i18n="close">Fechar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
