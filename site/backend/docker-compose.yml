# Servidor do YTGrab Web — instância própria do Cobalt (open source, AGPL)
# https://github.com/imputnet/cobalt
#
# Sem API_KEY/turnstile configurados, a API fica ANÔNIMA e com CORS aberto —
# exatamente o que o site precisa.
#
# Variáveis (defina no painel do host):
#   API_URL  — URL pública da instância (com barra no final)  [obrigatória]
#   API_PORT — porta interna (padrão 9000)
#
# Render:  use este compose em "New → Web Service" (Runtime: Docker)
# Docker:  API_URL=https://seudominio/ API_PORT=9000 docker compose up -d

services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    restart: unless-stopped
    environment:
      - API_URL=${API_URL}
      - API_PORT=${API_PORT:-9000}
    ports:
      - "${API_PORT:-9000}:9000"
