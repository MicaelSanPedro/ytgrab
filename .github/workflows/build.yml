name: Build YTGrab

on:
  push:
    branches: [main, 'arena/01a07454-ytgrab']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Download bundled dependencies (yt-dlp + ffmpeg)
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "src-tauri\bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Write-Host ">> yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile (Join-Path $bin "yt-dlp.exe") -UseBasicParsing
          Write-Host ">> ffmpeg (essentials, gyan.dev)"
          $zip = Join-Path $PWD "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -UseBasicParsing
          $ext = Join-Path $PWD "ffmpeg-extract"
          Expand-Archive -Path $zip -DestinationPath $ext -Force
          $ff = Get-ChildItem -Path $ext -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe não encontrado no zip do gyan.dev" }
          Copy-Item -Path $ff.FullName -Destination (Join-Path $bin "ffmpeg.exe") -Force
          Remove-Item -Path $zip, $ext -Recurse -Force
          Get-ChildItem $bin | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'YTGrab v__VERSION__'
          releaseBody: 'Nova versão do YTGrab'
          releaseDraft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # AppImage (Linux desktop)
  #
  # Roda em ubuntu-22.04 de propósito: um AppImage herda a glibc de quem o
  # compilou, então usar o runner mais antigo disponível maximiza a
  # compatibilidade (glibc 2.35 => Ubuntu 22.04+, Debian 12+, Fedora 36+, ...).
  # Compilar em ubuntu-latest geraria um AppImage que só abre em distros bem
  # recentes.
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-v2-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools

      - name: Install frontend deps
        run: npm ci

      - name: Download bundled dependencies (yt-dlp + ffmpeg estático)
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin

          # Binário standalone: já traz o Python embutido, então o AppImage não
          # depende de python3 instalado na distro do usuário.
          echo ">> yt-dlp (standalone)"
          curl -fL --retry 3 -o src-tauri/bin/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"

          echo ">> ffmpeg (build estático do johnvansickle)"
          case "$(uname -m)" in
            x86_64)  FF_ARCH=amd64 ;;
            aarch64) FF_ARCH=arm64 ;;
            *) echo "arquitetura sem suporte: $(uname -m)"; exit 1 ;;
          esac
          curl -fL --retry 3 -o /tmp/ffmpeg.tar.xz \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-${FF_ARCH}-static.tar.xz"
          mkdir -p /tmp/ffmpeg-extract
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract
          FF=$(find /tmp/ffmpeg-extract -type f -name ffmpeg -perm -u+x | head -1)
          [ -n "$FF" ] || { echo "ffmpeg não encontrado no tarball"; exit 1; }
          cp "$FF" src-tauri/bin/ffmpeg
          FP=$(find /tmp/ffmpeg-extract -type f -name ffprobe -perm -u+x | head -1)
          [ -n "$FP" ] && cp "$FP" src-tauri/bin/ffprobe

          # Sem o bit de execução o app não consegue rodar o binário de dentro
          # do AppImage, que é montado somente leitura.
          chmod +x src-tauri/bin/yt-dlp src-tauri/bin/ffmpeg src-tauri/bin/ffprobe
          ls -la src-tauri/bin

      - name: Test real static ffmpeg extraction (host cargo test)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  FF_ARCH=amd64 ;;
            aarch64) FF_ARCH=arm64 ;;
          esac
          curl -fL --retry 3 -o /tmp/ffmpeg-fixture.tar.xz \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-${FF_ARCH}-static.tar.xz"
          rc=0
          FFMPEG_FIXTURE=/tmp/ffmpeg-fixture.tar.xz cargo test --lib > /tmp/linux-debtest.log 2>&1 || rc=$?
          tail -40 /tmp/linux-debtest.log
          exit $rc

      # `cargo build` falha com "failed to remove file ... Is a directory" se
      # existir um DIRETÓRIO em target/release/<nome-do-binário>, que é onde o
      # binário deve ser gravado. Aconteceu na primeira execução deste job e a
      # origem não ficou clara, então: limpamos antes (o cargo recria o binário
      # sem problema) e registramos o estado do diretório para o caso de
      # reaparecer — assim o log diz quem criou.
      - name: Limpar artefato conflitante em target/release
        run: |
          set -x
          ls -la src-tauri/target/release/ 2>/dev/null | head -30 || echo "target/release ainda não existe"
          if [ -d src-tauri/target/release/ytgrab ]; then
            echo "AVISO: target/release/ytgrab é um diretório — removendo"
            rm -rf src-tauri/target/release/ytgrab
          fi

      - name: Build AppImage
        run: |
          # Sem FUSE nos runners o appimagetool precisa se auto-extrair.
          export NO_STRIP=true
          export APPIMAGETOOL_APP_NAME="YTGrab"
          npm run tauri build -- --bundles appimage --config src-tauri/tauri.linux.conf.json
          ls -la src-tauri/target/release/bundle/appimage/

      - name: Publish AppImage to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v__VERSION__
          name: 'YTGrab v__VERSION__'
          append_body: true
          body: |

            ### Linux (AppImage)

            `YTGrab_v__VERSION___amd64.AppImage` — autocontido: já traz yt-dlp e ffmpeg estático,
            não precisa instalar nada nem de `python3`.

            ```bash
            chmod +x YTGrab_v__VERSION___amd64.AppImage
            ./YTGrab_v__VERSION___amd64.AppImage
            ```
          files: src-tauri/target/release/bundle/appimage/*.AppImage

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (for C build scripts)
        run: |
          yes | sdkmanager "ndk;29.0.13846066"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux system deps (tauri host build for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: cargo check (aarch64-linux-android)
        working-directory: src-tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for c in aarch64-linux-android21-clang aarch64-linux-android24-clang aarch64-linux-android26-clang aarch64-linux-android28-clang aarch64-linux-android30-clang; do
            if [ -x "$TOOLCHAIN/$c" ]; then
              export CC_aarch64_linux_android="$TOOLCHAIN/$c"
              break
            fi
          done
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          if [ -z "${CC_aarch64_linux_android:-}" ]; then
            echo "NDK clang não encontrado em $TOOLCHAIN"
            ls "$TOOLCHAIN" 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "CC_aarch64_linux_android=$CC_aarch64_linux_android"
          rc=0
          cargo check --target aarch64-linux-android > /tmp/android-check.log 2>&1 || rc=$?
          echo "----- últimas 40 linhas do cargo check -----"
          tail -40 /tmp/android-check.log
          exit $rc

      - name: Test real Termux .deb (host cargo test)
        working-directory: src-tauri
        run: |
          curl -fL --retry 3 "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" -o /tmp/Packages.gz
          gunzip -c /tmp/Packages.gz > /tmp/Packages
          FN=$(python3 - <<'PY'
          import re
          txt = open('/tmp/Packages', encoding='utf-8').read()
          pick = None
          for s in txt.split('Package: ')[1:]:
              name = s.split('\n', 1)[0].strip()
              if name == 'brotli':
                  m = re.search(r'Filename: (\S+)', s)
                  if m:
                      pick = m.group(1)
                      break
          if not pick:
              m = re.search(r'Filename: (\S+\.deb)', txt)
              pick = m.group(1) if m else None
          assert pick, 'nenhum Filename no índice'
          print(pick)
          PY
          )
          echo "Fixture: $FN"
          curl -fL --retry 3 "https://packages.termux.dev/apt/termux-main/$FN" -o /tmp/fixture.deb
          ls -la /tmp/fixture.deb
          rc=0
          DEB_FIXTURE=/tmp/fixture.deb cargo test --lib > /tmp/android-debtest.log 2>&1 || rc=$?
          tail -40 /tmp/android-debtest.log
          exit $rc

      - name: Verify real python+ffmpeg .deb contents (layout guard)
        run: |
          rc=0
          python3 ci/termux_deb_check.py > /tmp/android-debcheck.log 2>&1 || rc=$?
          tail -40 /tmp/android-debcheck.log
          exit $rc

      - name: Report check failure (draft release with log)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "_`cargo check --target aarch64-linux-android` falhou — run \`${GITHUB_RUN_ID}\`_"
            echo ""
            echo "NDK clang wrappers disponíveis:"
            ls "$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" 2>/dev/null | grep -c "" || true
            ls "$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" 2>/dev/null | grep "clang" | head -12 || true
            echo ""
            echo "Últimas 300 linhas do cargo check:"
            echo '```'
            tail -300 /tmp/android-check.log
            echo '```'
            if [ -f /tmp/android-debtest.log ]; then
              echo ""
              echo "Últimas 120 linhas do cargo test (.deb real):"
              echo '```'
              tail -120 /tmp/android-debtest.log
              echo '```'
            fi
            if [ -f /tmp/android-debcheck.log ]; then
              echo ""
              echo "Guard de layout dos debs (python/ffmpeg):"
              echo '```'
              tail -80 /tmp/android-debcheck.log
              echo '```'
            fi
          } > /tmp/fail-notes.md
          if gh release view ci-android-check-failure --json id >/dev/null 2>&1; then
            gh release edit ci-android-check-failure --draft --title "CI Android check failure (auto)" --notes-file /tmp/fail-notes.md
          else
            gh release create ci-android-check-failure --draft --target main --title "CI Android check failure (auto)" --notes-file /tmp/fail-notes.md
          fi || echo "nao consegui publicar o relatorio"

  build-android:
    runs-on: ubuntu-latest
    needs: [build-windows, android-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend deps
        run: npm ci

      - name: Sanity check (Termux index + runtime closure)
        run: |
          set -e
          # The app downloads this exact runtime on first use; fail fast if the
          # repository layout or the closure changes under us.
          curl -fL --retry 3 "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" -o /tmp/Packages.gz
          gunzip -c /tmp/Packages.gz > /tmp/Packages
          python3 ci/termux_closure.py /tmp/Packages python ffmpeg > /tmp/closure.txt
          echo "Pacotes baixados pelo app no 1º uso ($(wc -l < /tmp/closure.txt)):"
          cat /tmp/closure.txt

      - name: Build Android APK (arm64)
        run: |
          rc=0
          npx tauri android build --apk --target aarch64 > /tmp/android-build.log 2>&1 || rc=$?
          echo "----- últimas 120 linhas do build -----"
          tail -120 /tmp/android-build.log
          exit $rc

      - name: Upload build log (for diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/android-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Report build failure (draft release with log)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/android-build.log ] || exit 0
          {
            echo "_Log de falha do build Android (arm64) — atualizado automaticamente pelo CI._"
            echo ""
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo ""
            echo '```'
            tail -400 /tmp/android-build.log
            echo '```'
          } > /tmp/fail-notes.md
          if gh release view ci-android-failure --json id >/dev/null 2>&1; then
            gh release edit ci-android-failure --draft --title "CI Android failure (auto)" --notes-file /tmp/fail-notes.md
          else
            gh release create ci-android-failure --draft --target main --title "CI Android failure (auto)" --notes-file /tmp/fail-notes.md
          fi || echo "nao consegui publicar o relatorio"

      - name: Sign APK
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "app-universal-release-unsigned.apk" -type f | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "APK não encontrado!"
            find src-tauri/gen/android -name "*.apk" -type f || true
            exit 1
          fi
          echo "Assinando $UNSIGNED"
          "$APKSIGNER" sign \
            --ks "src-tauri/gen/android/keystore/ytgrab-release.keystore" \
            --ks-key-alias ytgrab \
            --ks-pass "pass:ytgrab-release" \
            --out "YTGrab_${VERSION}_android.apk" \
            "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "YTGrab_${VERSION}_android.apk"
          ls -la "YTGrab_${VERSION}_android.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "v${VERSION}" "YTGrab_${VERSION}_android.apk" --clobber
          echo "APK anexado à release v${VERSION}"
