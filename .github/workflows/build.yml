name: Build YTGrab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'YTGrab v__VERSION__'
          releaseBody: 'Nova versão do YTGrab'
          releaseDraft: false
          prerelease: false

  build-android:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend deps
        run: npm ci

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Sign APK
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "app-universal-release-unsigned.apk" -type f | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "APK não encontrado!"
            find src-tauri/gen/android -name "*.apk" -type f || true
            exit 1
          fi
          echo "Assinando $UNSIGNED"
          "$APKSIGNER" sign \
            --ks "src-tauri/gen/android/keystore/ytgrab-release.keystore" \
            --ks-key-alias ytgrab \
            --ks-pass "pass:ytgrab-release" \
            --out "YTGrab_${VERSION}_android.apk" \
            "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "YTGrab_${VERSION}_android.apk"
          ls -la "YTGrab_${VERSION}_android.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "v${VERSION}" "YTGrab_${VERSION}_android.apk" --clobber
          echo "APK anexado à release v${VERSION}"
